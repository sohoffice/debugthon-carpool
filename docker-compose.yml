# Fixed project name, so every checkout and git worktree reaches the same container and data volume
# (debugthon-carpool-postgres-1, debugthon-carpool_pgdata). `just infra down`/`reset` from any of them
# act on that shared one; set COMPOSE_PROJECT_NAME (and POSTGRES_PORT) for a separate database.
name: debugthon-carpool

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carpool}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql/18/docker; mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: the first-boot init server listens on the unix socket only,
      # so this passes only once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-carpool}"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
