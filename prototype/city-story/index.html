<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>市府儀表板故事模式</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Generated by serve.py from the repo-root .env; missing when served another way, which falls back to OpenStreetMap. -->
<script src="config.js"></script>
<script src="data.js"></script>
<style>
  :root {
    --brand: #00707c; --brand-dark: #005660; --brand-soft: #d6eef0; --brand-glow: #5fd0d6;
    --ink: #132126; --ink-soft: #56666c; --rule: #d5dcdd;
    --danger: #c0362c; --sim: #6a4fb8; --sim-light: #c8b9ff; --phone: #2f5bea;
    --font: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); font-family: var(--font); }
  body { display: flex; flex-direction: column; }

  header { height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; background: var(--ink); color: #fff; }
  header .title { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 17px; white-space: nowrap; }
  header .title::before { content: ''; width: 6px; height: 22px; background: var(--brand-glow); border-radius: 2px; }
  header .sub { font-weight: 500; font-size: 14px; opacity: .8; }
  .badge-sim { display: inline-block; border: 1.5px solid currentColor; color: var(--sim); border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 700; line-height: 20px; background: #fff; }
  header .badge-sim { color: var(--sim-light); background: transparent; }
  .legend { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #d7e0e2; white-space: nowrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .ramp { width: 70px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgb(245,215,110), rgb(244,190,72) 45%, rgb(238,140,40) 68%, rgb(234,118,40) 78%, rgb(204,48,40) 88%, rgb(190,36,38)); }
  .legend .line { width: 16px; height: 4px; border-radius: 2px; }

  main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #edf1ef; }
  #map { position: absolute; inset: 0; background: #edf1ef; }
  /* OSM's default style is colourful; mute it like the Google style below. */
  #map.muted .leaflet-tile-pane { filter: grayscale(1) brightness(1.1) contrast(.75); }

  /* The story layer sits above the map, in screen pixels of <main>. */
  .story-layer { position: absolute; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
  .story-layer > * { position: absolute; left: 0; top: 0; }
  .story-svg { width: 100%; height: 100%; overflow: visible; z-index: 0; }
  .story-svg .park { fill: rgba(214,238,240,.4); stroke: var(--brand); stroke-width: 2; stroke-dasharray: 6 6; }
  .story-svg .mrt-line { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .story-svg .walk { fill: none; stroke: var(--ink-soft); stroke-width: 1.5; stroke-dasharray: 2 4; }
  .heat { z-index: 1; border-radius: 50%; }
  .park-label { z-index: 2; }
  .park-label span { display: block; transform: translate(-50%, -50%); color: var(--brand-dark); font: 800 15px var(--font); white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .pin { z-index: 3; }
  .pin .body { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); }
  .pin .label { background: var(--brand); color: #fff; font: 800 13px var(--font); border-radius: 6px; padding: 2px 8px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .pin .stem { width: 2px; height: 6px; background: var(--brand); }
  .pin .dot { width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 3px solid var(--brand); margin-bottom: -6px; }
  .bldg { z-index: 3; }
  /* The bottlenecks the hackathon brief names. */
  .bneck { z-index: 3; }
  .bneck span { display: block; transform: translate(-50%, -180%); background: #fff; color: var(--danger); border: 1.5px solid var(--danger); font: 800 12px var(--font); border-radius: 4px; padding: 0 6px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .bldg span { display: block; transform: translate(-50%, -50%); background: rgba(19,33,38,.82); color: #fff; font: 700 11px var(--font); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .car { z-index: 4; width: 20px; height: 20px; margin: -10px 0 0 -10px; display: flex; align-items: center; justify-content: center; }
  .car svg { filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  /* The head count sits on the car body itself and stays upright while the car turns. */
  .car .rider { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font: 900 12px/1 var(--font); text-shadow: 0 0 2px #004b52, 0 0 2px #004b52, 0 0 1px #004b52; }
  /* A carpool car is bright teal with a glow from the moment it leaves home; the head count appears once it has picked people up. */
  .car.carpool { z-index: 6; }
  .car.carpool svg { transform-origin: center; filter: drop-shadow(0 0 3px rgba(0,163,173,.95)) drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .car.boarded .rider { display: flex; }
  .car.boarded svg rect + rect { display: none; }
  .person { z-index: 5; width: 13px; height: 17px; margin: -18px 0 0 4px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
  .person.on-mrt { margin: -9px 0 0 -6px; }
  .person .phone { position: absolute; left: 11px; top: -8px; width: 8px; height: 12px; border: 2px solid var(--phone); border-radius: 2px; background: #fff; transform: scale(0); transform-origin: bottom left; transition: transform .3s cubic-bezier(.2,1.8,.4,1); }
  .person.app .phone { transform: scale(1); }

  .caption { position: absolute; top: 14px; left: 14px; z-index: 500; background: rgba(255,255,255,.96); border-radius: 12px; box-shadow: 0 4px 18px rgba(19,33,38,.18); padding: 12px 20px; min-width: 320px; max-width: 540px; }
  .caption h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .02em; }
  .caption p { margin: 4px 0 0; font-size: 15px; color: var(--ink-soft); }
  .caption p:empty { display: none; }


  .counts { position: absolute; right: 14px; bottom: 14px; z-index: 500; width: 250px; background: #fff; border-radius: 12px; box-shadow: 0 4px 18px rgba(19,33,38,.18); padding: 10px 16px; }
  .counts h3 { margin: 0 0 4px; font-size: 14px; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
  .counts .row { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; border-top: 1px solid var(--rule); }
  .counts .row:first-of-type { border-top: 0; }
  .counts .row span { font-size: 14px; }
  .counts .row b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .counts .row b.cars, .counts .row b.jam { color: var(--danger); }

  .summary { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(16px); z-index: 600; background: var(--brand); color: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,86,96,.35); padding: 14px 26px; text-align: center; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
  .summary.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .summary .big { font-size: 28px; font-weight: 900; white-space: nowrap; }
  .summary .big s { opacity: .65; }
  .summary .sub { margin-top: 4px; font-size: 18px; font-weight: 700; }
  .summary .note { margin-top: 6px; font-size: 12px; opacity: .9; }

  .base-note { position: absolute; left: 14px; bottom: 6px; z-index: 500; background: rgba(255,255,255,.85); border-radius: 6px; padding: 1px 8px; font-size: 11px; color: var(--ink-soft); max-width: 560px; }
  .base-note.warn { color: var(--danger); font-weight: 700; font-size: 12px; }

  footer { flex-shrink: 0; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-top: 1px solid var(--rule); background: #fff; }
  footer button, footer select { height: 34px; border-radius: 8px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); font: 700 14px var(--font); padding: 0 12px; cursor: pointer; }
  footer button.primary { background: var(--ink); color: #fff; min-width: 76px; }
  .scrub { flex: 1; position: relative; padding-bottom: 14px; }
  .scrub input { width: 100%; accent-color: var(--brand); }
  .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; font-size: 11px; color: var(--ink-soft); }
  .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .clock { font: 700 14px var(--font); font-variant-numeric: tabular-nums; width: 96px; text-align: right; }
  footer label { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<header>
  <div class="title">內科順路共乘 <span class="sub">市府管理 · 故事模式 prototype</span> <span class="badge-sim">模擬</span></div>
  <div class="legend">
    <span>越慢越紅 <i class="ramp"></i></span>
    <span><i style="display:inline-block;width:14px;height:10px;border:1.5px solid #e07b70;border-radius:2px"></i>題目點名的瓶頸</span>
    <span><svg width="10" height="15" viewBox="0 0 14 22"><rect x="1" y="1" width="12" height="20" rx="4" fill="#132126" stroke="#fff" stroke-width="1.5"/></svg>獨自開車</span>
    <span><svg width="10" height="15" viewBox="0 0 14 22"><rect x="1" y="1" width="12" height="20" rx="4" fill="#00a3ad" stroke="#fff" stroke-width="1.5"/></svg>共乘（數字＝人數）</span>
    <span><svg width="10" height="13" viewBox="0 0 13 17"><path d="M1.2 16.2c0-3.9 2.4-6.3 5.3-6.3s5.3 2.4 5.3 6.3z" fill="#fff" stroke="#3d4d52" stroke-width="1.5"/><circle cx="6.5" cy="4.6" r="3.4" fill="#fff" stroke="#3d4d52" stroke-width="1.5"/></svg>走路／搭捷運</span>
    <span><i class="line" style="background:#008659"></i>松山新店→松山</span>
    <span><i class="line" style="background:#e3002c"></i>淡水信義→世貿</span>
    <span><i class="line" style="background:#f8b61c"></i>中和新蘆→行天宮</span>
    <span><i class="line" style="background:#0070bd"></i>板南→大巨蛋</span>
  </div>
</header>
<main id="main">
  <div id="map"></div>
  <div class="caption" id="caption"><h2></h2><p></p></div>
  <div class="counts">
    <h3>往內科 <span class="badge-sim">示意</span></h3>
    <div class="row"><span>出發的人</span><b id="nPeople">0</b></div>
    <div class="row"><span>開上路的車</span><b id="nCars" class="cars">0</b></div>
    <div class="row"><span>每車平均坐</span><b id="nAvg">–</b></div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="base-note" id="baseNote">載入底圖中…</div>
</main>
<footer>
  <button class="primary" id="play">暫停</button>
  <button id="restart">從頭</button>
  <div class="scrub"><input type="range" id="scrub" min="0" max="50" step="0.01" value="0"><div class="ticks" id="ticks"></div></div>
  <span class="clock" id="clock">0.0 s</span>
  <label>採用比例 <select id="ratio"><option value="0" selected>0%</option><option value="0.1">10%</option><option value="0.2">20%</option><option value="0.3">30%</option><option value="0.5">50%</option></select></label>
  <label>速度 <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label>
</footer>

<script>
// Same order as the pickup index in DATA.homes.
const PICKUPS = [
  { name: '松山車站', lat: 25.049806, lng: 121.578206 },
  { name: '台北世貿中心', lat: 25.03315, lng: 121.5619 },
  { name: '台北大巨蛋', lat: 25.044249, lng: 121.557934 },
  { name: '行天宮', lat: 25.05941, lng: 121.53316 },
]
// From data.js: homes, Neihu destinations and road routes (OSRM over OpenStreetMap); station order per line and
// track segments (© OpenStreetMap contributors, ODbL); the park boundary from backend/config/park.
const { routes: DATA, stations: STATIONS, tracks: MRT_TRACKS, park: PARK } = window.STORY_DATA
const LINE_COLORS = { 松山新店: '#008659', 淡水信義: '#e3002c', 板南: '#0070bd', 中和新蘆: '#f8b61c' }
// The station each pickup point sits by. `key` is a station sequence in STATIONS; 中和新蘆線 has two branches
// (迴龍 and 蘆洲) that both run through 行天宮.
const MRT = [
  { key: '松山新店', line: '松山新店', pickup: 0, station: '松山' },
  { key: '淡水信義', line: '淡水信義', pickup: 1, station: '台北101/世貿' },
  { key: '板南', line: '板南', pickup: 2, station: '國父紀念館' },
  { key: '中和新蘆-迴龍', line: '中和新蘆', pickup: 3, station: '行天宮' },
  { key: '中和新蘆-蘆洲', line: '中和新蘆', pickup: 3, station: '行天宮' },
]

// The part of the city where the people and cars are; the far ends of 新店 and 士林 drive in from off screen.
const ACTION = { south: 25.004, north: 25.088, west: 121.432, east: 121.598 }
// Muted raster style after docs/data/map-styles/mist.json: the base map only hints at the city.
const MUTED_STYLE = [
  { elementType: 'geometry', stylers: [{ color: '#edf1ef' }] },
  { elementType: 'labels', stylers: [{ visibility: 'off' }] },
  { featureType: 'administrative', elementType: 'geometry', stylers: [{ visibility: 'off' }] },
  { featureType: 'administrative.locality', elementType: 'labels.text', stylers: [{ visibility: 'on' }] },
  { featureType: 'administrative', elementType: 'labels.text.fill', stylers: [{ color: '#9aa8a6' }] },
  { featureType: 'administrative', elementType: 'labels.text.stroke', stylers: [{ color: '#edf1ef' }] },
  { featureType: 'poi', stylers: [{ visibility: 'off' }] },
  { featureType: 'poi.park', elementType: 'geometry', stylers: [{ visibility: 'on' }, { color: '#e2ebe5' }] },
  { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
  { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#e1e7e4' }] },
  { featureType: 'road.local', elementType: 'geometry', stylers: [{ color: '#f5f7f6' }] },
  { featureType: 'transit', stylers: [{ visibility: 'off' }] },
  { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#d3e3e6' }] },
]

// Story metres per second for a car at its road's free speed. The animation exaggerates slowdowns so it is plain
// where the roads are slower than usual: see slowness(). The numbers on screen keep the data's speeds.
const SPEED = { car: 1400, train: 2400, walk: 600 }
// How slow a stretch looks, 0..1, from its speed as a share of free speed: nothing above 95%, the full effect from
// 65% down. A car on it moves at lerp(1, CRAWL, slowness) of its free pace, and glows and heats on the same scale.
const SLOW_FROM = 0.95, SLOW_FULL = 0.65, CRAWL = 0.15
const slowness = (share) => clamp01((SLOW_FROM - share) / (SLOW_FROM - SLOW_FULL))
// Occupancy (the share of time a car sits on the sensor) catches queues at signals where the average speed holds
// up, as on 民權大橋. It scales from the busiest slot measured as volume^occExp, the exponent fitted per detector
// over the 2026-10-22 peak slots (calibrate_vd.py). OCC[0]% or less is free, OCC[1]% (the highest measured) fully
// jammed. A stretch is as congested as the worse of its speed and its occupancy say.
const OCC = [15, 55]
const occupancy = (d, q) => d.occPeak * Math.pow(Math.max(0, q) / d.qPeak, d.occExp)
const congestion = (d, q, v) => Math.max(slowness(v / d.vf), clamp01((occupancy(d, q) - OCC[0]) / (OCC[1] - OCC[0])))
// Heat shows only within HEAT_RADIUS_M of a simulated car: it fades in over PRESENCE_EASE story seconds as cars
// arrive and out over PRESENCE_RELEASE once they have gone.
const HEAT_RADIUS_M = 200
const PRESENCE_EASE = 0.5, PRESENCE_RELEASE = 0.2
const easePresence = (h, on) => h + (on - h) * (DT / (on > h ? PRESENCE_EASE : PRESENCE_RELEASE))
// Few simulated people stand for many real ones, so they leave within a short window to make the jam visible.
const DEPARTURES = [2, 4.5]
// Riders per carpool car, in turn: two (three aboard), then one (two aboard), 2.5 people per car on average. Each
// pickup point and building has only a few riders, so starting with two keeps short queues near that average.
const GROUP_SIZES = [2, 1]
// The adoption rate is the share of people who used to drive alone and now use the service, drivers and riders
// alike. At 2.5 people per carpool car, 1.5 of every 2.5 adopters ride and the rest drive.
const RIDER_SHARE_OF_ADOPTERS = 1.5 / 2.5
const DT = 0.05
// Each detector's speed follows the BPR curve fitted to TDX VD data for 2026-10-22 (calibrate_vd.py):
// speed = vf / (1 + 0.15 (q / cap)^4), q in vehicles per 15 minutes, vf the night (01:00-05:00) speed.
const BPR = { alpha: 0.15, beta: 4 }
// The most and least road one detector stands for on a route, for travel times and for car speeds (see addReach).
const REACH_M = [300, 1200]
// The scene's rush hour: every detector reaches its scene volume once this share of the cars is on the Neihu leg,
// eased over this many story seconds so the heat does not flicker.
const RUSH = { share: 0.3, ease: 0.8 }
// Roads where the TDX data showed the morning slowdown, used for the "main entries" speed on screen.
const KEY_DETECTORS = [['VQBUL20', 'E'], ['VMSV820', 'NE'], ['VLMRH20', 'E'], ['VRHT600', 'N'], ['VPMSV40', 'S'], ['VTXQJ20', 'E'], ['VSEMA00', 'N']]
const DETECTORS = DATA.detectors
const KEY = KEY_DETECTORS.map(([vd, dir]) => DETECTORS.findIndex((d) => d.vd === vd && d.dir === dir)).filter((i) => i >= 0)

function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
const lerp = (a, b, f) => a + (b - a) * f
const clamp01 = (f) => Math.min(1, Math.max(0, f))
const span = (t, a, b) => clamp01((t - a) / (b - a))
const latLng = (p) => [p.lat, p.lng]
const M_PER_LAT = 110540
const M_PER_LNG = 111320 * Math.cos(((ACTION.south + ACTION.north) / 2) * Math.PI / 180)

function meters(a, b) {
  return Math.hypot((b[0] - a[0]) * M_PER_LAT, (b[1] - a[1]) * M_PER_LNG)
}
function makePath(points, hits = []) {
  const cum = [0]
  for (let i = 1; i < points.length; i++) cum.push(cum[i - 1] + meters(points[i - 1], points[i]))
  return { points, cum, len: cum[cum.length - 1] || 1, hits }
}
function along(path, f) {
  const d = clamp01(f) * path.len
  let i = 1
  while (i < path.points.length - 1 && path.cum[i] < d) i++
  const a = path.points[i - 1], b = path.points[i] ?? a
  const seg = path.cum[i] - path.cum[i - 1] || 1
  const k = clamp01((d - path.cum[i - 1]) / seg)
  const heading = (Math.atan2((b[1] - a[1]) * M_PER_LNG, (b[0] - a[0]) * M_PER_LAT) * 180) / Math.PI
  return { at: [lerp(a[0], b[0], k), lerp(a[1], b[1], k)], heading }
}

const bprSpeed = (d, q) => d.vf / (1 + BPR.alpha * Math.pow(Math.max(0, q) / d.cap, BPR.beta))
// Extra seconds a car loses on a detector's stretch at speed v instead of free speed.
const delay = (d, v, reach) => reach / (v / 3.6) - reach / (d.vf / 3.6)

// On a route a detector stands for the road halfway to the detectors before and after it (within REACH_M), so
// hits become [detector, metres along, metres of road it stands for].
function addReach(route) {
  route.hits = route.hits.map(([di, at], i, hs) => {
    const before = i ? at - hs[i - 1][1] : 2 * at
    const after = i < hs.length - 1 ? hs[i + 1][1] - at : 2 * (route.distance_m - at)
    return [di, at, Math.min(REACH_M[1], Math.max(REACH_M[0], (before + after) / 2))]
  })
}
DATA.homes.forEach((h) => h.routes.forEach(addReach))
Object.values(DATA.onward).forEach((routes) => routes.forEach(addReach))

// The Neihu leg of a route starts at its first point within NEIHU_ZONE_M of the park, just before the bridges; the
// rush builds up as cars reach it.
const NEIHU_ZONE_M = 1200
function addNeihuLeg(route) {
  const path = makePath(route.points)
  const i = route.points.findIndex((p) => PARK.some((q) => meters(p, q) < NEIHU_ZONE_M))
  route.zoneStart = i < 0 ? path.len : path.cum[i]
}
DATA.homes.forEach((h) => h.routes.forEach(addNeihuLeg))
Object.values(DATA.onward).forEach((routes) => routes.forEach(addNeihuLeg))

// The bridges the hackathon brief names as bottlenecks. None has an inbound detector on the bridge itself, so each
// takes the congestion of the inbound detector just before or after it (TDX VD, 2026-10-22).
const BOTTLENECK_BRIDGES = [
  { name: '民權大橋', ways: ['民權大橋'], detector: ['VQBUL20', 'E'] },
  { name: '麥帥橋', ways: ['麥帥一橋', '麥帥二橋'], detector: ['VLMRH20', 'E'] },
  { name: '成美橋', ways: ['成美橋'], detector: ['VMSV820', 'NE'] },
].map((b) => {
  const lines = b.ways.flatMap((w) => window.STORY_DATA.bridges[w] ?? [])
  const pts = lines.flat()
  const di = DETECTORS.findIndex((d) => d.vd === b.detector[0] && d.dir === b.detector[1])
  const at = [pts.reduce((sum, p) => sum + p[0], 0) / pts.length, pts.reduce((sum, p) => sum + p[1], 0) / pts.length]
  return { ...b, lines, pts, di, at }
})
// Heat spots along every way of each bridge (both carriageways and the ramps), about 100 m apart; each glows only
// while a car crossing that bridge is near it.
const BRIDGE_SPOTS = BOTTLENECK_BRIDGES.flatMap((b, bi) => b.pts.reduce((spots, p) => {
  if (spots.every((s) => meters(s.at, p) >= 100)) spots.push({ bi, at: p })
  return spots
}, []))
// Distance in metres from p to segment a-b, and how far along the segment (0..1) the nearest point is.
function segDist(p, a, b) {
  const bx = (b[1] - a[1]) * M_PER_LNG, by = (b[0] - a[0]) * M_PER_LAT
  const px = (p[1] - a[1]) * M_PER_LNG, py = (p[0] - a[0]) * M_PER_LAT
  const len = bx * bx + by * by
  const t = len ? clamp01((px * bx + py * by) / len) : 0
  return { dist: Math.hypot(px - t * bx, py - t * by), t }
}
// Where a route runs over each bottleneck bridge: [bridge, from metres, to metres] along the route.
function addBridgeSpans(route) {
  const path = makePath(route.points)
  route.bridgeSpans = []
  BOTTLENECK_BRIDGES.forEach((b, bi) => {
    const at = []
    for (const q of b.pts) {
      let best = null
      for (let i = 1; i < path.points.length; i++) {
        const { dist, t } = segDist(q, path.points[i - 1], path.points[i])
        if (dist < 40 && (!best || dist < best.dist)) best = { dist, along: path.cum[i - 1] + t * (path.cum[i] - path.cum[i - 1]) }
      }
      if (best) at.push(best.along)
    }
    if (at.length >= 2) route.bridgeSpans.push([bi, Math.min(...at) - 30, Math.max(...at) + 30])
  })
}
DATA.homes.forEach((h) => h.routes.forEach(addBridgeSpans))
Object.values(DATA.onward).forEach((routes) => routes.forEach(addBridgeSpans))

// The entry detectors whose measured peak volumes (2026-10-22) set how many people take each bridge.
const ENTRY_DETECTORS = { 民權大橋: ['VQBUL20', 'E'], 麥帥橋: ['VLMRH20', 'E'], 大直橋: ['VSEMA00', 'N'], 成美橋: ['VMSV820', 'NE'] }

/**
 * Route choice, calibrated to the counts: people are shared out over the bridges into Neihu in the proportions the
 * entry detectors measured, starting from everyone's fastest bridge and moving whoever loses least by switching
 * until each bridge has its share. People with no candidate over those bridges (north of the river) keep their
 * fastest route. Returns the chosen candidate index per driver. candsList: [[{ duration_s, entry }]].
 */
function shareOutBridges(candsList) {
  const bridges = Object.keys(ENTRY_DETECTORS)
  const best = candsList.map((cands) => Object.fromEntries(bridges.map((e) => {
    const k = cands.reduce((b, c, i) => (c.entry === e && (b < 0 || c.duration_s < cands[b].duration_s) ? i : b), -1)
    return [e, k]
  })))
  const choice = candsList.map(() => 0)
  const entry = candsList.map(() => null)
  const eligible = candsList.map((_, i) => i).filter((i) => bridges.some((e) => best[i][e] >= 0))
  eligible.forEach((i) => {
    const e = bridges.filter((b) => best[i][b] >= 0).sort((a, b) => candsList[i][best[i][a]].duration_s - candsList[i][best[i][b]].duration_s)[0]
    entry[i] = e
  })
  const volume = Object.fromEntries(bridges.map((e) => {
    const [vd, dir] = ENTRY_DETECTORS[e]
    return [e, DETECTORS.find((d) => d.vd === vd && d.dir === dir).qPeak]
  }))
  const total = bridges.reduce((sum, e) => sum + volume[e], 0)
  const quota = Object.fromEntries(bridges.map((e) => [e, Math.round((volume[e] / total) * eligible.length)]))
  const load = (e) => eligible.filter((i) => entry[i] === e).length
  for (let moves = 0; moves < 1000; moves++) {
    let pick = null
    for (const i of eligible) {
      const from = entry[i]
      if (load(from) <= quota[from]) continue
      for (const to of bridges) {
        if (to === from || best[i][to] < 0 || load(to) >= quota[to]) continue
        const loss = candsList[i][best[i][to]].duration_s - candsList[i][best[i][from]].duration_s
        if (!pick || loss < pick.loss) pick = { i, to, loss }
      }
    }
    if (!pick) break
    entry[pick.i] = pick.to
  }
  eligible.forEach((i) => { choice[i] = best[i][entry[i]] })
  return choice
}

/**
 * People avoid the more congested bridge. Starting from `choice0`, each round a shrinking share of the drivers
 * (method of successive averages) switches to the candidate that is quickest at the current speeds, until no one
 * gains more than SWITCH_GAIN_S by moving. Returns loads() for the final choice.
 */
const SWITCH_GAIN_S = 30
function rebalance(candsList, choice0, perCar, background, share, bias) {
  const choice = [...choice0]
  for (let it = 1; it <= 60; it++) {
    const { speed } = loads(candsList, choice, perCar, background, share)
    candsList.forEach((cands, i) => {
      if (((i * 7919 + it * 104729) % 1009) / 1009 >= 1 / (it + 1)) return
      let best = choice[i]
      cands.forEach((c, k) => { if (routeCost(c, speed, bias) < routeCost(cands[best], speed, bias) - SWITCH_GAIN_S) best = k })
      choice[i] = best
    })
  }
  return loads(candsList, choice, perCar, background, share)
}
// Seconds a driver expects a route to take: empty-road time plus the delay on every detector's stretch and bottleneck
// bridge at the BPR speeds, plus the bias of its entry.
const routeCost = (c, speed, bias) => c.duration_s + (bias[c.entry] ?? 0) +
  c.hits.reduce((sum, [di, , reach]) => sum + delay(DETECTORS[di], speed[di], reach), 0) +
  (c.bridgeSpans ?? []).reduce((sum, [bi, from, to]) => {
    const di = BOTTLENECK_BRIDGES[bi].di
    return sum + delay(DETECTORS[di], speed[di], to - from)
  }, 0)
/**
 * Seconds added to every route through each entry so that the measured bridge shares (0% adoption) are an equilibrium: with
 * these, the sampled commuters choosing freely end up on the bridges in the shares shareOutBridges() gave them. They
 * stand for what the road network misses (signals, ramps, habit). Runs with adoption keep them, so whoever switches
 * bridges there does so because of congestion alone. Returns the bias and the 0% choice it settles on.
 */
function entryBias(candsList, choice0, fit) {
  const count = (choice) => candsList.reduce((m, cands, i) => { const e = cands[choice[i]].entry; m[e] = (m[e] || 0) + 1; return m }, {})
  const target = count(choice0)
  const bias = {}
  let a
  for (let round = 0; round < 30; round++) {
    a = rebalance(candsList, choice0, fit.perCar, fit.background, 1, bias)
    const now = count(a.choice)
    for (const e of new Set([...Object.keys(target), ...Object.keys(now)])) {
      bias[e] = (bias[e] ?? 0) + 60 * Math.log(((now[e] || 0) + 1) / ((target[e] || 0) + 1))
    }
  }
  return { bias, choice: a.choice }
}

// Vehicles per 15 minutes on each detector, and the speeds they give: perCar[detector] real vehicles for every
// simulated car on it, plus its background traffic times `share`.
function loads(candsList, choice, perCar, background, share) {
  const q = Float64Array.from(background, (b) => b * share)
  candsList.forEach((cands, i) => cands[choice[i]].hits.forEach(([di]) => { q[di] += perCar[di] }))
  return { choice, q, speed: DETECTORS.map((d, di) => bprSpeed(d, q[di])) }
}

/**
 * Drives every vehicle step by step. Away from detectors a car goes its free speed; on a detector's stretch it
 * slows by that detector's congestion (speed or occupancy, whichever is worse). Detectors follow their BPR curve towards the scene's volume as the scene's
 * cars reach the Neihu leg (RUSH). `presence` records, per detector, whether simulated cars are on its stretch,
 * so the heat shows only where the cars on screen are held up.
 * Vehicles: { legs: [path with hits], start, holdUntil? } (a carpool car waits at the end of its first leg).
 * q: vehicles per 15 minutes on each detector at the height of this scene, background included, from loads().
 */
function simulate(vehicles, t0, q) {
  const live = vehicles.map((v) => ({ v, state: 'home', leg: 0, dist: 0 }))
  vehicles.forEach((v) => { v.track = [] })
  const speeds = [], jams = [], presence = []
  let rush = 0
  let here = new Float64Array(DETECTORS.length)
  let hereBridge = new Float64Array(BRIDGE_SPOTS.length)
  const bridgePresence = []
  for (let step = 0; step < 6000; step++) {
    const t = t0 + step * DT
    const inNeihu = live.filter((s) => s.state === 'moving' && s.dist >= (s.v.legs[s.leg].zoneStart ?? Infinity)).length
    rush += (clamp01(inNeihu / (RUSH.share * vehicles.length)) - rush) * (DT / RUSH.ease)
    const v = DETECTORS.map((d, di) => bprSpeed(d, q[di] * rush))
    const jam = DETECTORS.map((d, di) => congestion(d, q[di] * rush, v[di]))
    speeds.push(v)
    jams.push(jam)
    const onStretch = new Uint8Array(DETECTORS.length)
    const onBridge = new Uint8Array(BRIDGE_SPOTS.length)
    for (const s of live) {
      const veh = s.v
      if (s.state === 'home' && t >= veh.start) s.state = 'moving'
      if (s.state === 'holding' && t >= veh.holdUntil) { s.state = 'moving'; s.leg++; s.dist = 0; veh.leave = t }
      const path = veh.legs[s.leg]
      const p = s.state === 'home' ? { at: path.points[0], heading: null } : along(path, s.dist / path.len)
      const hit = s.state === 'moving' && path.hits.find(([, at, reach]) => Math.abs(at - s.dist) < reach / 2)
      let jamHere = hit ? jam[hit[0]] : 0
      if (hit && Math.abs(hit[1] - s.dist) < HEAT_RADIUS_M) onStretch[hit[0]] = 1
      // On a bottleneck bridge a car slows as much as the bridge's detector says.
      const span = s.state === 'moving' && path.bridgeSpans?.find(([, from, to]) => s.dist >= from && s.dist <= to)
      if (span) {
        jamHere = Math.max(jamHere, jam[BOTTLENECK_BRIDGES[span[0]].di])
        BRIDGE_SPOTS.forEach((spot, si) => { if (spot.bi === span[0] && meters(spot.at, p.at) < HEAT_RADIUS_M) onBridge[si] = 1 })
      }
      veh.track.push({ at: p.at, heading: p.heading, state: s.state, jam: jamHere })
      if (s.state !== 'moving') continue
      s.dist += SPEED.car * lerp(1, CRAWL, jamHere) * DT
      if (s.dist < path.len) continue
      s.dist = path.len
      if (s.leg < veh.legs.length - 1) { s.state = 'holding'; veh.reach = t }
      else { s.state = 'arrived'; veh.arrive = t }
    }
    here = here.map((h, di) => easePresence(h, onStretch[di]))
    presence.push(here)
    hereBridge = hereBridge.map((h, si) => easePresence(h, onBridge[si]))
    bridgePresence.push(hereBridge)
    if (live.every((s) => s.state === 'arrived')) return { t0, speeds, jams, presence, bridgePresence, end: t }
  }
  throw new Error('simulation did not finish')
}
// A vehicle's interpolated position at time t.
function trackAt(sim, v, t) {
  const x = Math.max(0, (t - sim.t0) / DT)
  const i = Math.min(v.track.length - 1, Math.floor(x))
  const a = v.track[i], b = v.track[Math.min(v.track.length - 1, i + 1)]
  const k = x - i
  return { at: [lerp(a.at[0], b.at[0], k), lerp(a.at[1], b.at[1], k)], heading: b.heading ?? a.heading, state: a.state, jam: a.jam }
}
const frameAt = (sim, list, t) => list[Math.min(list.length - 1, Math.max(0, Math.round((t - sim.t0) / DT)))]
const keySpeed = (v) => KEY.reduce((s, di) => s + v[di], 0) / KEY.length
const candPath = (c) => Object.assign(makePath(c.points, c.hits), { zoneStart: c.zoneStart, bridgeSpans: c.bridgeSpans })

/**
 * Ties the 0% morning to the data. The simulated commuters are a sample: each stands for `scale` real vehicles per 15
 * minutes, the median ratio of measured peak volume to sampled cars on the detectors they use, but never more
 * than a detector measured in total (so a road the sample happens to crowd is not pushed past its real volume).
 * Whatever else a detector measured on 2026-10-22 (traffic from 汐止, 南港, Neihu itself, through traffic) is its
 * background, so at 0% each detector carries its measured volume and so runs at its measured speed.
 */
function calibrate(candsList, choice) {
  const zero = new Float64Array(DETECTORS.length)
  const free = loads(candsList, choice, new Float64Array(DETECTORS.length).fill(1), zero, 0)
  const ratios = DETECTORS.map((d, di) => (free.q[di] >= 5 ? d.qPeak / free.q[di] : null)).filter((x) => x).sort((a, b) => a - b)
  const scale = Math.round(ratios[Math.floor(ratios.length / 2)])
  const perCar = Float64Array.from(DETECTORS, (d, di) => (free.q[di] ? Math.min(scale, d.qPeak / free.q[di]) : scale))
  const background = Float64Array.from(DETECTORS, (d, di) => Math.max(0, d.qPeak - perCar[di] * free.q[di]))
  const a = loads(candsList, choice, perCar, background, 1)
  let err = 0
  a.speed.forEach((v, di) => { err += Math.log(v / DETECTORS[di].vPeak) ** 2 })
  return { scale, perCar, background, a, err: err / DETECTORS.length }
}

// ---- plan: who drives, who rides the MRT, who picks up whom ----
function buildPlan(ratio) {
  const r = rng(20261024)
  const n = DATA.homes.length
  const commuters = DATA.homes.map((h, id) => ({ id, home: h.at, destIdx: h.dest, dep1: lerp(DEPARTURES[0], DEPARTURES[1], r()) }))

  // Each commuter's usual route: everyone driving, over the bridges in the shares the entry detectors measured, each on
  // the route quickest for them given those shares (entryBias).
  const cands1 = commuters.map((c) => DATA.homes[c.id].routes)
  const measured = shareOutBridges(cands1)
  const { bias, choice: choice1 } = entryBias(cands1, measured, calibrate(cands1, measured))
  const fit = calibrate(cands1, choice1)
  const scale = fit.scale
  commuters.forEach((c, i) => { c.route1 = DATA.homes[c.id].routes[fit.a.choice[i]] })

  // Everyone leaves home at the same moment whatever the adoption rate; those who adopted open the app first.
  const T = { intro: DEPARTURES[0], app: 0.5 }

  // People living near one of the lines (not right next to a pickup station) take the MRT, to whichever
  // pickup station is quickest by walk plus ride.
  const candidates = []
  for (const c of commuters) {
    let best = null
    MRT.forEach((line, li) => {
      const stations = STATIONS[line.key]
      const target = stations.findIndex((s) => s.name === line.station)
      stations.forEach((s, si) => {
        if (Math.abs(si - target) < 2) return
        const walk = meters(c.home, latLng(s))
        const ride = makePath((si < target ? stations.slice(si, target + 1) : stations.slice(target, si + 1)).map(latLng)).len
        const cost = walk + ride / 4
        if (walk < 1500 && (!best || cost < best.cost)) best = { li, si, target, walk, cost }
      })
    })
    if (best) candidates.push({ c, ...best })
  }
  candidates.sort((a, b) => a.walk - b.walk)
  candidates.slice(0, Math.round(ratio * n * RIDER_SHARE_OF_ADOPTERS)).forEach(({ c, li, si, target }) => {
    const line = MRT[li]
    const stations = STATIONS[line.key]
    const seq = si < target ? stations.slice(si, target + 1) : stations.slice(target, si + 1).reverse()
    c.role = 'rider'
    c.line = line
    c.pickup = line.pickup
    c.walk1 = makePath([c.home, latLng(seq[0])])
    c.ride = makePath(seq.map(latLng))
    c.walkStart = c.dep1 - 0.6
    c.rideStart = c.walkStart + 0.4 + c.walk1.len / SPEED.walk
    c.rideEnd = c.rideStart + c.ride.len / SPEED.train
  })

  // Riders only share a car with a driver going to the same building; per pickup point and building they are
  // grouped in arrival order, each group taking the driver with the smallest detour.
  PICKUPS.forEach((p, pi) => {
    const waitingHere = commuters.filter((c) => c.role === 'rider' && c.pickup === pi)
    waitingHere.forEach((c, k) => {
      const ang = (k / Math.max(6, waitingHere.length)) * Math.PI * 2
      c.wait = [p.lat + 0.0009 * Math.sin(ang), p.lng + 0.0011 * Math.cos(ang)]
      c.walk2 = makePath([c.ride.points[c.ride.points.length - 1], c.wait])
      c.atPickup = c.rideEnd + 0.3 + c.walk2.len / SPEED.walk
    })
    DATA.dests.forEach((_, di) => {
      const onward = DATA.onward[`${pi}|${di}`]
      const waiting = waitingHere.filter((c) => c.destIdx === di).sort((a, b) => a.atPickup - b.atPickup)
      const detour = (c) => DATA.homes[c.id].toPickups[pi].distance_m + onward[0].distance_m - c.route1.distance_m
      const drivers = commuters.filter((c) => !c.role && c.destIdx === di && DATA.homes[c.id].toPickups[pi]).sort((a, b) => detour(a) - detour(b))
      for (let g = 0, from = 0; from < waiting.length; g++) {
        const d = drivers[g]
        const group = waiting.slice(from, from + GROUP_SIZES[g % GROUP_SIZES.length])
        from += group.length
        if (!d) continue
        d.role = 'carpool'
        d.pickupIdx = pi
        d.riders = group
        group.forEach((c) => { c.driver = d })
      }
    })
  })
  // Riders no driver could take drive themselves instead of waiting forever.
  commuters.filter((c) => c.role === 'rider' && !c.driver).forEach((c) => { c.role = undefined })
  commuters.filter((c) => !c.role).forEach((c) => { c.role = 'solo' })

  // The morning at this adoption rate. With no one adopting it is the measured morning, unchanged. Otherwise
  // everyone still driving starts from their usual bridge (a carpool car from the pickup point, over its driver's
  // usual bridge where it can) and then rebalances, moving off whichever bridge is now more congested than the others.
  // Background traffic is assumed to switch to carpooling in the same share as the simulated commuters.
  const drivers = commuters.filter((c) => c.role !== 'rider')
  const share = drivers.length / n
  const cands = drivers.map((c) => (c.role === 'carpool' ? DATA.onward[`${c.pickupIdx}|${c.destIdx}`] : DATA.homes[c.id].routes))
  const usual = drivers.map((c, i) => {
    if (c.role !== 'carpool') return cands[i].indexOf(c.route1)
    const same = cands[i].findIndex((r) => r.entry === c.route1.entry)
    return same >= 0 ? same : 0
  })
  const a = ratio > 0 ? rebalance(cands, usual, fit.perCar, fit.background, share, bias) : fit.a
  drivers.forEach((c, i) => {
    c.route = cands[i][a.choice[i]]
    if (c.role === 'carpool') {
      const last = Math.max(...c.riders.map((x) => x.atPickup))
      const leg1 = makePath(DATA.homes[c.id].toPickups[c.pickupIdx].points)
      c.trip = { legs: [leg1, candPath(c.route)], start: Math.max(T.intro - 0.2, last + 0.4 - leg1.len / SPEED.car), holdUntil: last + 0.6 }
    } else {
      c.trip = { legs: [candPath(c.route)], start: c.dep1 }
    }
  })
  const sim = simulate(drivers.map((c) => c.trip), 0, a.q)

  // When the main entries are at their slowest.
  const key = sim.speeds.map(keySpeed)
  T.peak = key.indexOf(Math.min(...key)) * DT
  T.ridersUntil = Math.max(0, ...commuters.filter((c) => c.role === 'rider').map((c) => c.rideEnd))
  const arrivals = drivers.map((c) => c.trip.arrive).sort((x, y) => x - y)
  T.summary = arrivals[Math.floor(arrivals.length * 0.9)] + 0.5
  T.total = T.summary + 6

  const entries = (cs, k) => cs.reduce((m, c) => { const e = c[k].entry; m[e] = (m[e] || 0) + 1; return m }, {})
  return {
    commuters, T, sim, n, scale, fitErr: fit.err, cars: drivers.length, nRiders: n - drivers.length,
    adopters: commuters.filter((c) => c.role === 'rider' || c.role === 'carpool').length,
    entries1: entries(commuters, 'route1'), entries: entries(drivers, 'route'),
    solo: drivers.filter((c) => c.role === 'solo').length,
  }
}

const CAR_SVG = (fill) => `<svg width="12" height="19" viewBox="0 0 14 22"><rect x="1" y="1" width="12" height="20" rx="4" fill="${fill}" stroke="#fff" stroke-width="1.5"/><rect x="3" y="5" width="8" height="4" rx="1.5" fill="#d6eef0"/><rect x="3" y="15.5" width="8" height="2.5" rx="1" fill="#8fa0a5"/></svg>`
// A white head-and-shoulders figure with a dark outline: solid enough to sit next to the cars, white so it never reads as one.
const PERSON_SVG = `<svg width="13" height="17" viewBox="0 0 13 17"><path d="M1.2 16.2c0-3.9 2.4-6.3 5.3-6.3s5.3 2.4 5.3 6.3z" fill="#fff" stroke="#3d4d52" stroke-width="1.5" stroke-linejoin="round"/><circle cx="6.5" cy="4.6" r="3.4" fill="#fff" stroke="#3d4d52" stroke-width="1.5"/></svg>`

let base = null
let plan, T, sprites = []
const place = (el, p) => {
  const q = base.project(p)
  el.style.transform = `translate(${q.x}px, ${q.y}px)`
}

function mountSprites() {
  sprites.forEach((s) => { s.carEl.remove(); s.personEl.remove(); s.walk && s.walk.remove() })
  sprites = plan.commuters.map((c) => {
    const carEl = document.createElement('div')
    carEl.className = 'car'
    carEl.innerHTML = CAR_SVG('#132126') + '<span class="rider"></span>'
    const personEl = document.createElement('div')
    personEl.className = 'person'
    personEl.innerHTML = PERSON_SVG + '<span class="phone"></span>'
    layer.append(carEl, personEl)
    let walk = null
    if (c.role === 'rider') {
      walk = document.createElementNS(SVG_NS, 'path')
      walk.setAttribute('class', 'walk')
      svg.append(walk)
    }
    return { c, carEl, personEl, walk, svg: carEl.querySelector('svg'), rider: carEl.querySelector('.rider'), fill: CAR_INK }
  })
}

// Parts that only move when the view changes.
function drawStatic() {
  const toPath = (points) => 'M' + points.map((p) => { const q = base.project(p); return `${q.x.toFixed(1)},${q.y.toFixed(1)}` }).join('L')
  mrtPaths.forEach((m) => m.path.setAttribute('d', m.tracks.map(toPath).join('')))
  parkPath.setAttribute('d', toPath(PARK) + 'Z')
  place(parkLabel, [25.0715, 121.5778])
  pins.forEach((p) => place(p.el, p.at))
  buildings.forEach((b) => place(b.el, b.at))
  bottleneckLabels.forEach((b) => place(b.el, b.at))
  sprites.forEach((s) => { if (s.walk) s.walk.setAttribute('d', toPath(s.c.walk1.points)) })
}

const CAR_INK = '#132126', CAR_POOL = '#00a3ad'
// pooling: a carpool car (teal from the start); riders: people picked up so far, shown as everyone aboard.
// jam: how congested the car's stretch is, 0..1. The more, the redder its glow, on the same scale as the heat.
function setCar(s, at, heading, opacity, pooling = false, riders = 0, jam = 0) {
  place(s.carEl, at)
  const red = jam
  const glows = [pooling ? 'drop-shadow(0 0 3px rgba(0,163,173,.95))' : '']
  if (red > 0.05) glows.push(`drop-shadow(0 0 ${2 + 4 * red}px rgba(224,48,42,${0.35 + 0.6 * red}))`)
  s.svg.style.filter = [...glows, 'drop-shadow(0 1px 1px rgba(0,0,0,.35))'].filter(Boolean).join(' ')
  s.carEl.style.opacity = opacity
  if (heading !== null && heading !== undefined) s.heading = heading
  s.svg.style.transform = `rotate(${s.heading ?? 0}deg) scale(${riders ? 1.45 : 1})`
  const fill = pooling ? CAR_POOL : CAR_INK
  if (fill !== s.fill) { s.svg.querySelector('rect').setAttribute('fill', fill); s.fill = fill }
  s.carEl.classList.toggle('carpool', pooling)
  s.carEl.classList.toggle('boarded', riders > 0)
  if (riders) s.rider.textContent = riders + 1
}
function setPerson(s, at, opacity, app, onMrt = false) {
  place(s.personEl, at)
  s.personEl.style.opacity = opacity
  s.personEl.classList.toggle('app', app)
  s.personEl.classList.toggle('on-mrt', onMrt)
}

function renderCommuter(s, t) {
  const c = s.c
  const show = span(t, 0.3, 1.2)
  const app = plan.adopters > 0 && t >= T.app
  if (c.role === 'rider') {
    setCar(s, c.home, null, show * (t >= c.walkStart ? 0.2 : 1))
    const leave = c.driver?.trip.leave
    const gone = leave !== undefined && t >= leave
    let at = c.home, onMrt = false
    if (t >= c.walkStart && t < c.rideStart) at = along(c.walk1, span(t, c.walkStart, c.rideStart)).at
    else if (t >= c.rideStart && t < c.rideEnd) { at = along(c.ride, span(t, c.rideStart, c.rideEnd)).at; onMrt = true }
    else if (t >= c.rideEnd) at = along(c.walk2, span(t, c.rideEnd, c.atPickup)).at
    setPerson(s, at, gone ? 0 : show, app && !onMrt && t < c.atPickup, onMrt)
    s.walk.style.opacity = t >= c.walkStart && t < c.rideStart + 1 ? 0.8 : 0
    return
  }
  const p = trackAt(plan.sim, c.trip, t)
  const boarded = c.role === 'carpool' && c.trip.leave !== undefined && t >= c.trip.leave ? c.riders.length : 0
  // Arrived carpool cars stay visible so the result is easy to read in the park.
  const arrivedOpacity = c.role === 'carpool' ? 0.85 : 0.3
  setCar(s, p.at, p.heading, show * (p.state === 'arrived' ? arrivedOpacity : 1), c.role === 'carpool', boarded, p.jam)
  setPerson(s, c.home, p.state === 'home' ? show : 0, app && p.state === 'home')
}

// Yellow → orange → red as a road slows down. Red is kept for the worst jams (at 0% the bottlenecks reach 85–100, at
// 30% most settle around 40–75), so the runs read as red against orange and yellow.
const HEAT_STOPS = [[0, [245, 215, 110]], [0.45, [244, 190, 72]], [0.68, [238, 140, 40]], [0.78, [234, 118, 40]], [0.88, [204, 48, 40]], [1, [190, 36, 38]]]
function heatRgb(w) {
  for (let i = 1; i < HEAT_STOPS.length; i++) {
    const [w1, c1] = HEAT_STOPS[i]
    if (w <= w1) {
      const [w0, c0] = HEAT_STOPS[i - 1]
      const k = (w - w0) / (w1 - w0)
      return c0.map((v, j) => Math.round(lerp(v, c1[j], k))).join(',')
    }
  }
  return HEAT_STOPS[HEAT_STOPS.length - 1][1].join(',')
}
// Heat sits on the real detectors and shows their congestion (speed or occupancy, whichever is worse), not how many cars.
function heatFrame(t) {
  const { sim } = plan
  return { jams: frameAt(sim, sim.jams, t), presence: frameAt(sim, sim.presence, t), bridges: frameAt(sim, sim.bridgePresence, t) }
}
// Heat shows only where the simulated cars on screen are held up: a detector's congestion while cars are near it,
// none on roads the simulated cars do not use.
function drawHeat(jams, presence) {
  DETECTORS.forEach((d, di) => {
    let el = heatEls.get(di)
    if (!el) {
      el = document.createElement('div')
      el.className = 'heat'
      layer.insertBefore(el, parkLabel)
      heatEls.set(di, el)
    }
    const w = jams[di]
    const size = lerp(28, 76, w)
    const core = 0.35 + 0.5 * w
    const rgb = heatRgb(w)
    place(el, d.at)
    el.style.opacity = presence[di] * clamp01(w / 0.15)
    el.style.width = el.style.height = `${size}px`
    el.style.margin = `${-size / 2}px 0 0 ${-size / 2}px`
    el.style.background = `radial-gradient(circle, rgba(${rgb},${core}) 0%, rgba(${rgb},${core / 3}) 45%, transparent 70%)`
  })
}

function drawBridgeHeat(jams, presence) {
  bridgeHeat.forEach(({ el, at, bi }, si) => {
    const w = jams[BOTTLENECK_BRIDGES[bi].di]
    const size = lerp(28, 76, w)
    const core = 0.35 + 0.5 * w
    const rgb = heatRgb(w)
    place(el, at)
    el.style.opacity = presence[si] * clamp01(w / 0.15)
    el.style.width = el.style.height = `${size}px`
    el.style.margin = `${-size / 2}px 0 0 ${-size / 2}px`
    el.style.background = `radial-gradient(circle, rgba(${rgb},${core}) 0%, rgba(${rgb},${core / 3}) 45%, transparent 70%)`
  })
}

function captionAt(t) {
  const adopt = Math.round((plan.adopters / plan.n) * 100)
  if (!plan.adopters) {
    if (t < T.intro) return ['平日早上，往內湖科學園區', '儀表板上的車流熱力（模擬資料）']
    if (t < T.peak) return ['大家從台北各地同時開車進內科', '每台車大多只坐一個人；路越塞，越紅']
    if (t < T.summary) return ['一人一車：進內科的路塞成停車場', '']
    return ['一人一車', '各路段車流量照 2026-10-22 早上實測']
  }
  if (t < T.intro) return ['同一個早上，如果改用「內科上班順起來」…', `假設原本開車的人有 ${adopt}% 採用（司機與乘客都算）`]
  if (t < T.ridersUntil + 0.5) return ['住捷運沿線的人，車留在家', '走到捷運站，搭到行天宮、松山車站、世貿、大巨蛋']
  if (t < T.summary) return ['同一棟大樓的人，順路一起進內科', '路上的車少了，剩下的車也開得比較順']
  return ['同樣多的人，更少的車', `示意：假設原本開車的人有 ${adopt}% 採用（司機與乘客都算），每台共乘車平均 2.5 人`]
}

function countsAt(t) {
  let people = 0, cars = 0, aboard = 0
  for (const c of plan.commuters) {
    if (c.role === 'rider') {
      if (t >= c.walkStart) people++
      if (c.driver?.trip.leave !== undefined && t >= c.driver.trip.leave) aboard++
    } else if (t >= c.trip.start) { people++; cars++; aboard++ }
  }
  return [people, cars, cars ? aboard / cars : 0]
}

const HEAT_NOTE = '熱力圖：用 TDX 2026-10-22 晨峰車輛偵測器的實測資料，把各路段車流量換算成車速與佔有率，取較塞的一項，只畫在模擬車輛正經過的路段'
function summaryHtml() {
  if (!plan.adopters) {
    return `<div class="big">0% 採用：${plan.n} 人進內科，就是 ${plan.n} 台車</div>` +
      `<div class="sub">一人一車，每台車平均坐 1.0 人</div>` +
      `<div class="note">${HEAT_NOTE}；0% 時各路段車流量等於當天實測值</div>`
  }
  const carPct = Math.round((1 - plan.cars / plan.n) * 100)
  const adoptPct = Math.round((plan.adopters / plan.n) * 100)
  return `<div class="big">${adoptPct}% 採用：${plan.n} 人進內科，車 <s>${plan.n}</s> → ${plan.cars} 台（−${carPct}%）</div>` +
    `<div class="sub">${plan.nRiders} 人搭捷運到上車點，坐上 ${plan.cars - plan.solo} 台共乘車；${plan.solo} 人仍自己開車</div>` +
    `<div class="note">採用比例為假設，每台共乘車平均 2.5 人。${HEAT_NOTE}；假設汐止、南港等其他地區的車也同比例減少，顏色變化為示意</div>`
}

const $ = (id) => document.getElementById(id)
let lastCaption = ''
function render(t) {
  const hf = heatFrame(t)
  if (base?.ready) {
    sprites.forEach((s) => renderCommuter(s, t))
    drawHeat(hf.jams, hf.presence)
    drawBridgeHeat(hf.jams, hf.bridges)
    pins.forEach((p) => { p.el.style.opacity = plan.adopters ? 1 : 0.55 })
    const riding = plan.adopters > 0 && t >= T.app && t < T.ridersUntil + 1
    mrtPaths.forEach((m) => { m.path.style.opacity = riding ? 0.95 : 0.4 })
  }
  const [h2, p] = captionAt(t)
  if (h2 + p !== lastCaption) { $('caption').querySelector('h2').textContent = h2; $('caption').querySelector('p').textContent = p; lastCaption = h2 + p }
  const [people, cars, avg] = countsAt(t)
  $('nPeople').textContent = people
  $('nCars').textContent = cars
  $('nAvg').textContent = avg ? avg.toFixed(1) : '–'
  // Only while it shows, so a card fading out after a switch of adoption rate keeps the rate it was about.
  if (t >= T.summary) $('summary').innerHTML = summaryHtml()
  $('summary').classList.toggle('on', t >= T.summary)
  $('clock').textContent = `${t.toFixed(1)} / ${T.total.toFixed(0)} s`
  $('scrub').value = t
}

// A Google map can only project once its overlay has drawn; until then (and on a resize before that) wait.
function redraw() {
  if (!base?.ready) return
  drawStatic()
  render(t)
}

// ---- base maps ----
// Web Mercator: the whole zoom closest to fitting ACTION into <main> (raster Google maps take whole zooms only).
// When that crops the box, keep its north-east corner, where Neihu is, and let the far south-west run off screen.
function fitView() {
  const main = $('main')
  const W = main.clientWidth, H = main.clientHeight
  const mx = (lng) => (lng + 180) / 360
  const my = (lat) => { const r = (lat * Math.PI) / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 }
  const lat = (y) => (Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180) / Math.PI
  const fit = Math.log2(Math.min(W / ((mx(ACTION.east) - mx(ACTION.west)) * 256), H / ((my(ACTION.south) - my(ACTION.north)) * 256)))
  const zoom = Math.max(13, Math.round(fit))
  const world = 256 * Math.pow(2, zoom)
  const halfX = W / 2 / world, halfY = H / 2 / world
  const cx = Math.max((mx(ACTION.west) + mx(ACTION.east)) / 2, mx(ACTION.east) - halfX)
  const cy = Math.min((my(ACTION.north) + my(ACTION.south)) / 2, my(ACTION.north) + halfY)
  return { zoom, center: { lat: lat(cy), lng: cx * 360 - 180 } }
}
function freshMapElement() {
  const el = document.createElement('div')
  el.id = 'map'
  $('map').replaceWith(el)
  return el
}
function setBaseNote(text, warn = false) {
  $('baseNote').textContent = text
  $('baseNote').classList.toggle('warn', warn)
}

function loadGoogleMaps(key) {
  return new Promise((resolve, reject) => {
    window.__storyMapsReady = resolve
    const script = document.createElement('script')
    script.async = true
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly&loading=async&language=zh-TW&region=TW&callback=__storyMapsReady`
    script.onerror = () => reject(new Error('Google 地圖載入失敗'))
    document.head.append(script)
  })
}

// JSON styles only work on a raster map without a Map ID.
async function useGoogle(key) {
  window.gm_authFailure = () => useOsm('Google 拒絕了這把金鑰；若金鑰有網址限制，請加上 http://localhost:5180/*', true)
  await loadGoogleMaps(key)
  const v = fitView()
  const map = new google.maps.Map(freshMapElement(), {
    renderingType: google.maps.RenderingType.RASTER, styles: MUTED_STYLE, center: v.center, zoom: v.zoom,
    disableDefaultUI: true, gestureHandling: 'none', keyboardShortcuts: false, clickableIcons: false,
  })
  class Projector extends google.maps.OverlayView {
    onAdd() {}
    draw() { base.ready = true; redraw() }
    onRemove() {}
  }
  const projector = new Projector()
  base = {
    kind: 'google',
    ready: false,
    project: (p) => projector.getProjection().fromLatLngToContainerPixel(new google.maps.LatLng(p[0], p[1])),
    refit: () => { const nv = fitView(); map.setZoom(nv.zoom); map.setCenter(nv.center) },
  }
  projector.setMap(map)
  setBaseNote('入口車流比例與塞車路段依 TDX VD 2026-10-22 07:00–09:30 校準 · 底圖 Google · 路線 OSRM · 捷運線 © OpenStreetMap contributors')
}

function useOsm(reason, warn = false) {
  if (base?.kind === 'osm') return
  const el = freshMapElement()
  el.classList.add('muted')
  const map = L.map(el, { zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false })
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map)
  const v = fitView()
  map.setView(v.center, v.zoom)
  base = {
    kind: 'osm', ready: true,
    project: (p) => map.latLngToContainerPoint(p),
    refit: () => { map.invalidateSize(); const nv = fitView(); map.setView(nv.center, nv.zoom) },
  }
  map.on('zoomend moveend resize viewreset', redraw)
  setBaseNote('底圖：OpenStreetMap' + (reason ? `（${reason}）` : ''), warn)
  redraw()
}

async function startBaseMap() {
  const key = window.STORY_CONFIG?.mapsKey
  if (new URLSearchParams(location.search).get('base') === 'osm') return useOsm('網址指定 ?base=osm')
  if (!key) return useOsm('沒有讀到 VITE_GOOGLE_MAPS_API_KEY，請用 serve.py 啟動')
  try {
    await useGoogle(key)
  } catch (e) {
    useOsm(e.message, true)
  }
}

// ---- playback ----
let t = 0, playing = true, speed = 1, last = performance.now()
function frame(now) {
  const dt = (now - last) / 1000
  last = now
  if (playing) {
    t = Math.min(T.total, t + dt * speed)
    if (t >= T.total) setPlaying(false)
    render(t)
  }
  requestAnimationFrame(frame)
}
function setPlaying(on) { playing = on; $('play').textContent = on ? '暫停' : '播放' }
function usePlan(ratio) {
  plan = buildPlan(ratio)
  T = plan.T
  $('scrub').max = T.total
  const ticks = plan.adopters
    ? [[0, '改用 App'], [T.intro, '同時出發'], [T.summary, '成果']]
    : [[0, '現況'], [T.intro, '同時出發'], [T.peak, '一人一車'], [T.summary, '成果']]
  $('ticks').innerHTML = ticks.map(([s, label]) => `<span style="left:${(s / T.total) * 100}%">${label}</span>`).join('')
  mountSprites()
}
$('play').onclick = () => { if (t >= T.total) t = 0; setPlaying(!playing) }
$('restart').onclick = () => { t = 0; setPlaying(true) }
$('scrub').oninput = (e) => { t = Number(e.target.value); setPlaying(false); render(t) }
$('speed').onchange = (e) => { speed = Number(e.target.value) }
$('ratio').onchange = (e) => { usePlan(Number(e.target.value)); t = 0; redraw(); setPlaying(true) }
document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); $('play').click() } })
window.addEventListener('resize', () => { base?.refit(); redraw() })

usePlan(Number($('ratio').value))
render(0)
startBaseMap()
requestAnimationFrame(frame)
</script>
</body>
